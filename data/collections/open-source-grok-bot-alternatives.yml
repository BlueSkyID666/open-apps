entries:
  - slug: rakazo
    pinned: true
    note: Best match for Grok Bot's shape. Persistent bots with memory, routines and their own browser, terminal and desktop, on web, desktop and mobile; local Docker or cloud sandboxes. Apache-2.0, a beta since August 2026.
  - slug: rome
    note: Best if you want the agent to build software. Repeated work becomes git-tracked actions and small apps you can read and reuse, reachable from Telegram, Discord or WhatsApp. MIT, a month old.
ranking:
  preset: curated
editorial:
  introduction: Two self-hosted takes on Grok Bot's idea of AI teammates that persist and keep working. Rakazo gives each bot its own computer and apps on every device; Rome turns what the agent learns into code and apps you keep.
  selectionNote: >-
    Self-hostable applications for persistent AI agents, with an OSI-approved
    licence and commits in the last 30 days. Each record's relation to Grok Bot
    is the project's own words. Checked against GitHub on 28 September 2026.
  lastReviewedAt: "2026-09-28"
faq:
  - q: Is there a self-hosted Grok Bot alternative?
    a: Rakazo and Rome both self-host with Docker. Rakazo's installer brings up the full stack with generated secrets; Rome starts from one script on localhost.
  - q: Can I use my own model?
    a: Yes. Rakazo takes your own model credentials, and Rome lets you choose the model provider.
  - q: How mature are they?
    a: Both repositories were created in August 2026. Rakazo calls itself beta. Expect breaking changes and pin a version.
