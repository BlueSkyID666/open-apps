# Products that records in this directory are an alternative to.
#
# A subject gets no page of its own. A collection that declares
# `subject: <id>` is its hub (`/collections/open-source-<id>-alternatives/`),
# and records point here with `relations: [{ type: alternative-to, to: <id> }]`.
#
# Add a subject only when at least one record has verifiable evidence for the
# relation — the project's own description, README or a repository topic.
